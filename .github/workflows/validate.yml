
name: Validate FNAF 1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile game logic
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            src/main.cpp -o fnaf-tests

      - name: Run tests
        run: ./fnaf-tests
