
name: Validate FNAF Logic

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -Werror src/main.cpp -o fnaf-tests

      - name: Run tests
        run: ./fnaf-tests
